<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Aperçu du fil</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* Maquette du profil @btp_expertise avec la grille rangée par thématique. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1080px; background: #fff; font-family: Poppins, sans-serif; color: #262C42; }
  .profil { display: flex; gap: 60px; align-items: center; padding: 56px 70px 30px; }
  .avatar { width: 170px; height: 170px; border-radius: 50%; border: 2px solid #E3E7ED; display: grid; place-items: center; flex: 0 0 auto; }
  .avatar img { width: 120px; }
  .nom { font: 600 30px Poppins, sans-serif; }
  .stats { display: flex; gap: 40px; margin: 16px 0; font-size: 22px; }
  .stats b { font-weight: 600; }
  .bio { font-size: 20px; line-height: 1.5; color: #3A3F52; }
  .bio a { color: #0A93C2; text-decoration: none; }
  .onglets { border-top: 1.5px solid #E3E7ED; margin-top: 20px; }
  .legende { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 22px 0 14px; }
  .legende div { text-align: center; font: 700 19px Montserrat, sans-serif; letter-spacing: .16em; padding-bottom: 12px; border-bottom: 6px solid; }
  .legende .e { color: #0A93C2; border-color: #0BBBF6; }
  .legende .a { color: #E67B00; border-color: #FF8A00; }
  .legende .r { color: #262C42; border-color: #262C42; }
  .legende small { display: block; font: 400 16px Poppins, sans-serif; letter-spacing: 0; color: #6B7186; margin-top: 4px; }
  .grille { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .grille img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; display: block; }
  .separateur { display: flex; align-items: center; gap: 18px; padding: 26px 30px; color: #6B7186; font-size: 18px; }
  .separateur::before, .separateur::after { content: ""; flex: 1; height: 1.5px; background: #E3E7ED; }
  .ancien img { opacity: .55; }
</style>
</head>
<body>
  <div class="profil">
    <div class="avatar"><img src="logo-principal.png" alt=""></div>
    <div>
      <div class="nom">btp_expertise</div>
      <div class="stats"><span><b>16</b> publications</span><span><b>179</b> followers</span><span><b>216</b> suivi(e)s</span></div>
      <div class="bio"><b>BTP Expertise</b><br>Expertise bâtiment &amp; AMO · Nice, Alpes-Maritimes et Var<br><a>btpexpertise.fr</a></div>
    </div>
  </div>
  <div class="onglets">
    <div class="legende">
      <div class="e">EXPERTISE<small>désordres, avant achat</small></div>
      <div class="r">RÉSEAU<small>indépendants, candidatures</small></div>
      <div class="a">AMO<small>projets de travaux</small></div>
    </div>
    <div class="grille">
      <img src="../medias/2026-10-fissures-v3-1.jpg"><img src="../medias/reseau-rejoindre-1.jpg"><img src="../medias/2026-10-15-amo-devis-1.jpg">
      <img src="../medias/2026-10-13-toiture-1.jpg"><img src="../medias/reseau-competences-1.jpg"><img src="../medias/2026-10-22-reception-1.jpg">
      <img src="../medias/2026-10-20-facade-1.jpg"><img src="../medias/reseau-expert-1.jpg"><img src="../medias/2026-11-05-amo-chantier-1.jpg">
    </div>
    <div class="separateur">publications déjà en ligne</div>
    <div class="grille ancien">
      <img src="photos/ancien-1.jpg"><img src="photos/ancien-2.jpg"><img src="photos/ancien-3.jpg">
      <img src="photos/ancien-4.jpg"><img src="photos/ancien-5.jpg"><img src="photos/ancien-6.jpg">
    </div>
  </div>
</body>
</html>
