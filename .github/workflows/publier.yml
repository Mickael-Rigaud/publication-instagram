name: Publier sur Instagram

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Deux passages ne doivent jamais tourner en même temps (risque de double publication).
concurrency:
  group: publier
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publier les publications validées
        env:
          BASE_MEDIAS: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          META_TOKEN_BTP_EXPERTISE: ${{ secrets.META_TOKEN_BTP_EXPERTISE }}
        run: node scripts/publier.mjs

      # Enregistre le statut (publié / erreur) même si un passage a échoué.
      - name: Enregistrer les statuts
        if: always()
        run: |
          git config user.name "publication-instagram"
          git config user.email "actions@users.noreply.github.com"
          git add publications
          git diff --cached --quiet || (git commit -m "Statuts des publications" && git push)
