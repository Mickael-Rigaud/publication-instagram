name: Publier sur Instagram

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Deux passages ne doivent jamais tourner en même temps (risque de double publication).
concurrency:
  group: publier
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Depuis le 08/10/2026 la source est le calendrier de communication du
      # CRM Groupe : le script le lit et y écrit le résultat (publié / erreur)
      # par l'Edge Function `communication-publication`. Plus rien n'est écrit
      # dans ce dépôt.
      - name: Publier les contenus programmés du CRM
        env:
          CRM_PUB_URL: https://qnidmkufauzguultdmky.supabase.co/functions/v1/communication-publication
          CRM_PUB_TOKEN: ${{ secrets.CRM_PUB_TOKEN }}
          META_TOKEN_BTP_EXPERTISE: ${{ secrets.META_TOKEN_BTP_EXPERTISE }}
        run: node scripts/publier.mjs
